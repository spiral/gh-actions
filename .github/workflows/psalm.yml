name: psalm

on:
  workflow_call:
    inputs:
      os:
        description: Os to test, separated by comma.
        required: true
        type: string
      php:
        description: PHP versions to test, separated by comma.
        default: '["8.3"]'
        required: false
        type: string
      bin-tool:
        description: >-
          bamarni/composer-bin-plugin tool to install with `composer bin <bin-tool> install`
          after the root dependencies, e.g. `psalm`. Not installed when empty.
        default: ''
        required: false
        type: string
      command:
        description: >-
          Command that runs Psalm, e.g. `composer psalm:ci`. When empty:
          `vendor/bin/psalm --no-cache --shepherd --stats --output-format=checkstyle --php-version=<php>`.
        default: ''
        required: false
        type: string
      composer-no-scripts:
        description: >-
          Install the dependencies with `composer update --no-scripts`, skipping hooks such as `post-update-cmd`:
          the analysis rarely needs them, and they may download binaries. Set to `false` to run the scripts.
        default: true
        required: false
        type: boolean

jobs:
  psalm:
    name: PHP ${{ matrix.php }}-${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os) }}
        php: ${{ fromJson(inputs.php) }}

    steps:
      - name: Set Git To Use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout.
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure environment
        run: |
          export COMPOSER_ROOT_VERSION=$(/usr/bin/jq --null-input --raw-output 'first(inputs["extra"]["branch-alias"])[]' composer.json)
          echo COMPOSER_ROOT_VERSION=$COMPOSER_ROOT_VERSION >> $GITHUB_ENV

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Validate Composer
        run: composer validate

      - name: Get Composer Cache Directory
        # Docs: <https://github.com/actions/cache/blob/master/examples.md#php---composer>
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore Composer Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-${{ matrix.php }}-composer

      - name: Install Dependencies
        uses: nick-invision/retry@v2
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer update --prefer-dist --no-interaction --no-progress ${{ inputs.composer-no-scripts && '--no-scripts' || '' }}

      - name: Install ${{ inputs.bin-tool }} bin tool
        if: inputs.bin-tool != ''
        shell: bash
        env:
          BIN_TOOL: ${{ inputs.bin-tool }}
        run: composer bin "$BIN_TOOL" install --no-interaction --no-progress

      - name: Static Analysis
        shell: bash
        env:
          COMMAND: ${{ inputs.command || format('vendor/bin/psalm --no-cache --shepherd --stats --output-format=checkstyle --php-version={0}', matrix.php) }}
        run: eval "$COMMAND"
