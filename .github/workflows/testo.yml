name: testo

on:
  workflow_call:
    inputs:
      install_protoc:
        description: Install protoc.
        default: false
        required: false
        type: boolean
      coverage:
        description: Generate code coverage report.
        default: pcov
        required: false
        type: string
      extensions:
        description: List of extensions to PHP.
        default: sockets
        required: false
        type: string
      ini-values:
        description: Initial values for PHP configuration.
        default: memory_limit=-1
        required: false
        type: string
      os:
        description: Os to test, separated by comma.
        required: true
        type: string
      php:
        description: PHP versions to test, separated by comma.
        default: '["8.2","8.3","8.4","8.5","8.6"]'
        required: false
        type: string
      dependencies:
        description: Composer dependency versions to test, separated by comma.
        default: '["highest"]'
        required: false
        type: string
      run:
        description: Command to run tests.
        default: vendor/bin/testo
        required: false
        type: string
      test-server:
        description: Build and run the test server from tests/test-server.
        default: false
        required: false
        type: boolean
      downgrade-paths:
        description: Project paths downgraded by Rector on PHP 8.1, space-separated (Testo targets PHP 8.2).
        default: tests testo.php
        required: false
        type: string
      dload-cache:
        description: Cache the DLoad version registry between runs (DLOAD_CACHE_DIR).
        default: false
        required: false
        type: boolean
      codecov:
        description: "Write a Clover report via `--coverage-clover` and upload it to Codecov. Pass the CODECOV_TOKEN secret explicitly: `secrets: inherit` does not cross organizations."
        default: false
        required: false
        type: boolean
      codecov-php:
        description: With `codecov`, collect and upload coverage only in the jobs of this PHP version; the other jobs run without a coverage driver. Empty means every job.
        default: ''
        required: false
        type: string
      codecov-dependencies:
        description: With `codecov`, collect and upload coverage only in the jobs of this dependency set (`lowest` or `highest`). Empty means every job.
        default: ''
        required: false
        type: string
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  testo:
    name: PHP ${{ matrix.php }}-${{ matrix.os }}, ${{ matrix.dependencies }}

    runs-on: ${{ matrix.os }}

    env:
      DLOAD_CACHE_DIR: runtime/dload-cache
      # DLoad runs from Composer scripts and from the tests; unauthenticated GitHub API calls share a 60 per hour limit per runner IP.
      GITHUB_TOKEN: ${{ github.token }}
      CODECOV_JOB: ${{ inputs.codecov && (inputs.codecov-php == '' || inputs.codecov-php == matrix.php) && (inputs.codecov-dependencies == '' || inputs.codecov-dependencies == matrix.dependencies) }}

    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJson(inputs.php) }}
        os: ${{ fromJson(inputs.os) }}
        dependencies: ${{ fromJson(inputs.dependencies) }}

    steps:
      # General Steps
      - name: Set Git To Use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Install Protoc
        uses: arduino/setup-protoc@149f6c87b92550901b26acd1632e11c3662e381f # v1
        if: ${{ inputs.install_protoc }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore the DLoad version registry
        if: ${{ inputs.dload-cache }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/dload-cache
          key: dload-registry-${{ github.run_id }}-${{ strategy.job-index }}
          restore-keys: dload-registry-

      - name: Configure environment
        shell: bash
        run: |
          version=$(jq --raw-output 'first(.extra["branch-alias"][]?) // ""' composer.json)
          if [ -n "$version" ]; then
            echo "COMPOSER_ROOT_VERSION=$version" >> "$GITHUB_ENV"
          fi

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          # PHP Extras
          extensions: ${{ inputs.extensions }}
          coverage: ${{ (inputs.codecov && env.CODECOV_JOB != 'true') && 'none' || inputs.coverage }}
          tools: pecl
          ini-values: ${{ inputs.ini-values }}

      - name: Install Composer dependencies
        if: matrix.php != '8.1'
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: ${{ matrix.dependencies }}
          # PHP 8.6 is in development: allow dependencies that do not declare support yet
          composer-options: ${{ matrix.php == '8.6' && '--ignore-platform-req=php' || '' }}

      - name: Install and downgrade for PHP 8.1
        if: matrix.php == '8.1'
        uses: php-internal/actions/downgrade@846e2a397e38b869477ddfc8d2a204f7e509d126 # v1
        with:
          php-version: '8.1'
          dependency-versions: ${{ matrix.dependencies }}
          paths: ${{ inputs.downgrade-paths }}

      - name: Build test server
        run: docker build --tag test-server:local -f ./tests/test-server/Dockerfile ./tests/test-server
        if: ${{ inputs.test-server }}

      - name: Run test server
        run: docker run --name test-server --rm -d -p "7079:7079/tcp" test-server:local
        if: ${{ inputs.test-server }}

      # Execution
      - name: Execute Tests
        run: ${{ inputs.run }}${{ env.CODECOV_JOB == 'true' && ' --coverage-clover=coverage.clover' || '' }}

      - name: Upload coverage to Codecov
        if: env.CODECOV_JOB == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.clover
          # Only the report written above: reports a project configures itself would be uploaded twice.
          disable_search: true
          name: php-${{ matrix.php }}-${{ matrix.os }}-${{ matrix.dependencies }}
          fail_ci_if_error: false
