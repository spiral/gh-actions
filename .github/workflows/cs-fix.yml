name: coding-standards-fixer

on:
  workflow_call:
    inputs:
      os:
        description: Os to run the job on, separated by comma.
        required: false
        default: '["ubuntu-latest"]'
        type: string
      php:
        description: >-
          PHP versions to run the fixer on, as a JSON array. The root dependencies and the bin tool
          are installed for it (only `ext-*` requirements are ignored), so it must satisfy
          `require.php` of the repository and of the tool (spiral/code-style 2.4 needs PHP 8.2+).
        default: '["8.2"]'
        required: false
        type: string
      composer-root-version:
        description: >-
          Explicit COMPOSER_ROOT_VERSION for the root package. When empty,
          falls back to the first `extra.branch-alias` value in composer.json.
        default: ''
        required: false
        type: string
      bin-tool:
        description: >-
          bamarni/composer-bin-plugin tool to install with `composer bin <bin-tool> install`
          after the root dependencies, e.g. `code-style`. Not installed when empty.
        default: ''
        required: false
        type: string
      command:
        description: Command that runs the fixer, e.g. `composer cs:fix`.
        default: 'vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.dist.php -vvv --using-cache=no'
        required: false
        type: string

jobs:
  coding-standards:
    name: PHP ${{ matrix.php }}-${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os) }}
        php: ${{ fromJson(inputs.php) }}

    permissions:
      contents: write

    timeout-minutes: 5
    concurrency:
      cancel-in-progress: true
      group: coding-standards-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

    steps:
      - name: Set Git To Use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      # Credentials stay: the fixes are pushed back to the branch.
      - name: Checkout.
        uses: actions/checkout@v5

      - name: Configure environment
        env:
          INPUT_ROOT_VERSION: ${{ inputs.composer-root-version }}
        run: |
          version="$INPUT_ROOT_VERSION"
          if [ -z "$version" ]; then
            version=$(/usr/bin/jq --raw-output 'first(.extra["branch-alias"][]?) // ""' composer.json)
          fi
          if [ -n "$version" ]; then
            echo "COMPOSER_ROOT_VERSION=$version" >> "$GITHUB_ENV"
          fi

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Validate Composer
        run: composer validate

      - name: Get Composer Cache Directory
        # Docs: <https://github.com/actions/cache/blob/master/examples.md#php---composer>
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore Composer Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-${{ matrix.php }}-composer

      - name: Install Dependencies
        uses: nick-invision/retry@v2
        with:
          timeout_minutes: 5
          max_attempts: 5
          # Only extensions are ignored: the fixer does not need them, but it does need packages that run on this PHP.
          command: composer install --prefer-dist --no-interaction --no-progress --ignore-platform-req='ext-*'

      - name: Install ${{ inputs.bin-tool }} bin tool
        if: inputs.bin-tool != ''
        shell: bash
        env:
          BIN_TOOL: ${{ inputs.bin-tool }}
        run: composer bin "$BIN_TOOL" install --no-interaction --no-progress

      - name: Fix Code Style
        shell: bash
        env:
          COMMAND: ${{ inputs.command }}
        run: eval "$COMMAND"

      # Tracked files only: bin tool vendors and locks must never be committed, gitignored or not.
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5.0.1
        with:
          commit_message: 'style(php-cs-fixer): fix coding standards'
          branch: ${{ github.head_ref }}
          commit_author: 'github-actions <github-actions@users.noreply.github.com>'
          status_options: '--untracked-files=no'
          add_options: '-u'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
