name: coding-standards-fixer

on:
  workflow_call:
    inputs:
      os:
        description: Os to run the job on, separated by comma.
        required: false
        default: '["ubuntu-latest"]'
        type: string
      php:
        description: >-
          PHP versions to run the fixer on, as a JSON array. This is the runtime PHP: the
          code-style bin tool is installed for it, so it must satisfy the tool's PHP requirement
          (spiral/code-style 2.4 needs PHP 8.2+).
        default: '["8.2"]'
        required: false
        type: string
      composer-root-version:
        description: >-
          Explicit COMPOSER_ROOT_VERSION for the root package. When empty,
          falls back to the first `extra.branch-alias` value in composer.json.
        default: ''
        required: false
        type: string
      bin-tool:
        description: >-
          Name of the bamarni/composer-bin-plugin tool that holds PHP-CS-Fixer. When
          `<target-directory>/<bin-tool>/composer.json` exists, it is installed with `composer bin`.
        default: 'code-style'
        required: false
        type: string
      config:
        description: >-
          PHP-CS-Fixer config path. When empty: `<target-directory>/<bin-tool>/.php-cs-fixer.dist.php`
          if it exists, otherwise `.php-cs-fixer.dist.php`.
        default: ''
        required: false
        type: string

jobs:
  coding-standards:
    name: PHP ${{ matrix.php }}-${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os) }}
        php: ${{ fromJson(inputs.php) }}

    permissions:
      contents: write

    timeout-minutes: 5
    concurrency:
      cancel-in-progress: true
      group: coding-standards-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

    steps:
      - name: Set Git To Use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      # Credentials stay: the fixes are pushed back to the branch.
      - name: Checkout.
        uses: actions/checkout@v5

      - name: Configure environment
        env:
          INPUT_ROOT_VERSION: ${{ inputs.composer-root-version }}
        run: |
          version="$INPUT_ROOT_VERSION"
          if [ -z "$version" ]; then
            version=$(/usr/bin/jq --raw-output 'first(.extra["branch-alias"][]?) // ""' composer.json)
          fi
          if [ -n "$version" ]; then
            echo "COMPOSER_ROOT_VERSION=$version" >> "$GITHUB_ENV"
          fi

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Validate Composer
        run: composer validate

      - name: Get Composer Cache Directory
        # Docs: <https://github.com/actions/cache/blob/master/examples.md#php---composer>
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore Composer Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-${{ matrix.php }}-composer

      - name: Install Dependencies
        uses: nick-invision/retry@v2
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer install --prefer-dist --no-interaction --no-progress --ignore-platform-reqs

      - name: Detect bin tool
        id: bin
        shell: bash
        env:
          BIN_TOOL: ${{ inputs.bin-tool }}
          CONFIG: ${{ inputs.config }}
        run: |
          # Defaults are bamarni/composer-bin-plugin's own.
          read -r target bin_links < <(php -r '
            $extra = json_decode(file_get_contents("composer.json"), true)["extra"]["bamarni-bin"] ?? [];
            echo rtrim($extra["target-directory"] ?? "vendor-bin", "/"), " ", var_export($extra["bin-links"] ?? true, true), "\n";
          ')
          dir="$target/$BIN_TOOL"
          if [ -f "$dir/composer.json" ]; then
            if [ "$bin_links" != true ]; then
              echo "::error title=bin-links is disabled::The workflow runs bin tools from the root vendor/bin, so it needs \`extra.bamarni-bin.bin-links: true\` in composer.json."
              exit 1
            fi
            echo "dir=$dir" >> "$GITHUB_OUTPUT"
            if [ -z "$CONFIG" ] && [ -f "$dir/.php-cs-fixer.dist.php" ]; then
              CONFIG="$dir/.php-cs-fixer.dist.php"
            fi
          fi
          echo "config=${CONFIG:-.php-cs-fixer.dist.php}" >> "$GITHUB_OUTPUT"

      - name: Install ${{ inputs.bin-tool }} bin tool
        if: steps.bin.outputs.dir != ''
        shell: bash
        env:
          BIN_TOOL: ${{ inputs.bin-tool }}
          TOOL_DIR: ${{ steps.bin.outputs.dir }}
          PHP_VERSION: ${{ matrix.php }}
        run: |
          if ! composer bin --help > /dev/null 2>&1; then
            echo "::error title=Bin plugin is unavailable::${TOOL_DIR}/composer.json exists, but bamarni/composer-bin-plugin is not installed or not allowed at the root, so \`composer bin\` is unavailable. Require it in the root composer.json and allow it in \`config.allow-plugins\`."
            exit 1
          fi
          if ! composer bin "$BIN_TOOL" install --no-interaction --no-progress; then
            echo "::error title=Cannot install bin tool ${BIN_TOOL}::${TOOL_DIR}/composer.json cannot be installed on PHP ${PHP_VERSION} (see the Composer output above). If the tool needs another PHP version, set the \`php\` input of the cs-fix workflow to one it supports."
            exit 1
          fi

      - name: Fix Code Style
        shell: bash
        env:
          CONFIG: ${{ steps.bin.outputs.config }}
        run: |
          vendor/bin/php-cs-fixer fix --config="$CONFIG" -vvv --using-cache=no

      # Tracked files only: bin tool vendors and locks must never be committed, gitignored or not.
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5.0.1
        with:
          commit_message: 'style(php-cs-fixer): fix coding standards'
          branch: ${{ github.head_ref }}
          commit_author: 'github-actions <github-actions@users.noreply.github.com>'
          status_options: '--untracked-files=no'
          add_options: '-u'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
